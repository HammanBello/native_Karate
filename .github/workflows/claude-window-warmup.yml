# Démarre la fenêtre d'usage de 5h de l'abonnement Claude (Pro/Max) avant
# le début de la journée de travail, via un appel minimal à Claude Code.
#
# Exemple : un ping à 06:00 ouvre la fenêtre 06:00-11:00 ; la fenêtre suivante
# démarre dès le premier message après 11:00, au lieu d'être bloquée jusqu'à
# 14:00 si l'on avait commencé à travailler à 09:00.
#
# Prérequis : secret de dépôt CLAUDE_CODE_OAUTH_TOKEN, généré en local avec
#   claude setup-token
# (token lié à l'abonnement ; une clé API ne passe pas par les fenêtres de 5h).
name: Claude 5h window warm-up

on:
  schedule:
    # Horaires en UTC, tous les jours (lundi à dimanche).
    # Heure d'été Paris (UTC+2) : 06:00, 14:00, 19:00.
    # Heure d'hiver (UTC+1), ces mêmes crons tombent à 05:00, 13:00, 18:00.
    # Le déclenchement GitHub peut être retardé de quelques minutes.
    - cron: '0 4 * * *'   # 06:00 Paris -> fenêtre 06:00-11:00
    - cron: '0 12 * * *'  # 14:00 Paris -> fenêtre 14:00-19:00
    - cron: '0 17 * * *'  # 19:00 Paris -> fenêtre 19:00-00:00
  workflow_dispatch:

concurrency:
  group: claude-window-warmup
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Ping Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN manquant (générer avec 'claude setup-token')."
            exit 1
          fi
          claude -p "Réponds uniquement: ok" --model haiku --max-turns 1
