# Démarre la fenêtre d'usage de 5h de l'abonnement Claude (Pro/Max) avant
# le début de la journée de travail, via un appel minimal à Claude Code.
#
# Exemple : un ping à 06:00 (heure de Douala) ouvre la fenêtre 06:00-11:00 ; la fenêtre suivante
# démarre dès le premier message après 11:00, au lieu d'être bloquée jusqu'à
# 14:00 si l'on avait commencé à travailler à 09:00.
#
# Prérequis : secret de dépôt CLAUDE_CODE_OAUTH_TOKEN, généré en local avec
#   claude setup-token
# (token lié à l'abonnement ; une clé API ne passe pas par les fenêtres de 5h).
name: Claude 5h window warm-up

on:
  # Déclencheur principal : cron-job.org appelle l'API GitHub (workflow_dispatch)
  # à 05:58, 10:58, 15:58 et 20:58 (heure de Douala) avec l'input `target`
  # (06:00, 11:00, 16:00, 21:00). Le job attend alors l'heure cible.
  # Fenêtres de 5h successives dès 06:00. Pas d'appel à 02:00 : la fenêtre
  # 02:00-07:00 empêcherait celle de 06:00 le lendemain.
  workflow_dispatch:
    inputs:
      target:
        description: "Heure cible HH:MM (heure de Douala). Vide = ping immédiat."
        required: false
        default: ''

  # Secours : GitHub saute parfois des planifications, mais cron-job.org peut
  # aussi échouer. 15 min après chaque créneau, un appel immédiat. Si la fenêtre
  # est déjà ouverte il n'a aucun effet ; sinon il l'ouvre avec ~15 min de
  # décalage. Horaires en UTC (Douala = UTC+1 toute l'année).
  schedule:
    - cron: '15 5 * * *'   # secours 06:15 Douala
   # - cron: '15 10 * * *'  # secours 11:15 Douala
   # - cron: '15 15 * * *'  # secours 16:15 Douala
   # - cron: '15 20 * * *'  # secours 21:15 Douala

concurrency:
  group: claude-window-warmup
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Wait for target time and ping Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN manquant (générer avec 'claude setup-token')."
            exit 1
          fi

          # Heure cible (Douala) fournie par cron-job.org. Vide (secours,
          # lancement manuel) : ping immédiat.
          if [ -n "$TARGET" ] && ! [[ "$TARGET" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]$ ]]; then
            echo "::error::Input target invalide : '$TARGET' (attendu HH:MM)."
            exit 1
          fi

          ping_claude() {
            echo "Ping à $(TZ=Africa/Douala date +%H:%M:%S) (Douala)"
            claude -p "Réponds uniquement: ok" --model haiku --max-turns 1
          }

          if [ -z "$TARGET" ]; then
            ping_claude
            exit 0
          fi

          # Deux pings : cible +1 min et cible +5 min. Si la fenêtre précédente
          # a démarré avec un léger retard, le premier tombe encore dedans et
          # n'a aucun effet ; le second ouvre alors la nouvelle fenêtre.
          base=$(TZ=Africa/Douala date -d "today $TARGET" +%s)
          for offset in 1 5; do
            at=$(( base + offset * 60 ))
            wait=$(( at - $(date -u +%s) ))
            if [ "$wait" -gt 0 ]; then
              echo "Attente de ${wait}s jusqu'à $(TZ=Africa/Douala date -d "@$at" +%H:%M) (Douala)"
              sleep "$wait"
            fi
            ping_claude
          done
