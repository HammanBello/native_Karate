# Démarre la fenêtre d'usage de 5h de l'abonnement Claude (Pro/Max) avant
# le début de la journée de travail, via un appel minimal à Claude Code.
#
# Exemple : un ping à 06:00 (heure de Douala) ouvre la fenêtre 06:00-11:00 ; la fenêtre suivante
# démarre dès le premier message après 11:00, au lieu d'être bloquée jusqu'à
# 14:00 si l'on avait commencé à travailler à 09:00.
#
# Prérequis : secret de dépôt CLAUDE_CODE_OAUTH_TOKEN, généré en local avec
#   claude setup-token
# (token lié à l'abonnement ; une clé API ne passe pas par les fenêtres de 5h).
name: Claude 5h window warm-up

on:
  schedule:
    # Horaires en UTC, tous les jours (lundi à dimanche).
    # Douala (WAT) = UTC+1 toute l'année, pas de changement d'heure.
    # Fenêtres de 5h successives dès 06:00. Pas d'appel à 02:00 : la fenêtre
    # 02:00-07:00 empêcherait celle de 06:00 le lendemain.
    #
    # Le cron GitHub part souvent en retard (surtout à l'heure pile) : on le
    # déclenche 5 min en avance, puis le job attend l'heure cible (voir
    # TARGET plus bas). Garder les deux listes synchronisées.
    - cron: '55 4 * * *'   # cible 06:00 Douala -> fenêtre 06:00-11:00
    - cron: '55 9 * * *'   # cible 11:00 Douala -> fenêtre 11:00-16:00
    - cron: '55 14 * * *'  # cible 16:00 Douala -> fenêtre 16:00-21:00
    - cron: '55 19 * * *'  # cible 21:00 Douala -> fenêtre 21:00-02:00
    #
    # Secours : GitHub saute parfois des planifications. 15 min après chaque
    # créneau, un appel immédiat. Si la fenêtre est déjà ouverte il n'a aucun
    # effet ; sinon il l'ouvre avec au plus ~15 min de décalage.
    - cron: '15 5 * * *'   # secours 06:15 Douala
    - cron: '15 10 * * *'  # secours 11:15 Douala
    - cron: '15 15 * * *'  # secours 16:15 Douala
    - cron: '15 20 * * *'  # secours 21:15 Douala
  workflow_dispatch:

concurrency:
  group: claude-window-warmup
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Wait for target time and ping Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN manquant (générer avec 'claude setup-token')."
            exit 1
          fi

          # Cron (UTC) -> heure cible (UTC). Secours et lancement manuel :
          # ping immédiat.
          case "$SCHEDULE" in
            '55 4 * * *')  TARGET=05:00 ;;
            '55 9 * * *')  TARGET=10:00 ;;
            '55 14 * * *') TARGET=15:00 ;;
            '55 19 * * *') TARGET=20:00 ;;
            *)             TARGET= ;;
          esac

          ping_claude() {
            echo "Ping à $(date -u +%H:%M:%S) UTC"
            claude -p "Réponds uniquement: ok" --model haiku --max-turns 1
          }

          if [ -z "$TARGET" ]; then
            ping_claude
            exit 0
          fi

          # Deux pings : cible +1 min et cible +5 min. Si la fenêtre précédente
          # a démarré avec un léger retard, le premier tombe encore dedans et
          # n'a aucun effet ; le second ouvre alors la nouvelle fenêtre.
          base=$(date -u -d "today $TARGET" +%s)
          for offset in 1 5; do
            at=$(( base + offset * 60 ))
            wait=$(( at - $(date -u +%s) ))
            if [ "$wait" -gt 0 ]; then
              echo "Attente de ${wait}s jusqu'à $(date -u -d "@$at" +%H:%M) UTC"
              sleep "$wait"
            fi
            ping_claude
          done
