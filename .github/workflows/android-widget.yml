# Construit l'APK du widget Android « Conso Claude » (dossier android-widget/).
# L'APK est publié sur la branche widget-apk (lien direct :
# https://github.com/HammanBello/native_Karate/raw/widget-apk/conso-claude.apk)
# et dans l'onglet Actions → exécution → Artifacts.
name: Android widget APK

on:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p android-widget assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: conso-claude-apk
          path: android-widget/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to branch widget-apk
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk=$(ls android-widget/app/build/outputs/apk/release/*.apk | head -1)
          dir=$(mktemp -d)
          cp "$apk" "$dir/conso-claude.apk"
          cd "$dir"
          git init -q -b widget-apk
          git add conso-claude.apk
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "APK built from ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" widget-apk
